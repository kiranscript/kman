const SEV_RANK = { critical:4, high:3, medium:2, low:1 };
const key = n => S.keys.find(k => k.name === n);
const inc = id => S.incidents.find(i => i.id === id);

const money = v => v == null ? "–" : "$" + v.toFixed(2);
const rnd = n => { const a = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"; let s=""; for (let i=0;i<n;i++) s += a[Math.floor(Math.random()*a.length)]; return s; };
const newSecret = k => `kmn_${k.id}_${rnd(43)}${rnd(6)}`;

function risks(k) {
  const r = [];
  const i = incOfKey(k.name);
  if (i) r.push({ t:`${i.sev} incident ${i.id}`, cls: i.sev === "critical" || i.sev === "high" ? "bad" : "warn" });
  if (k.status === "disabled") r.push({ t:`disabled${k.disabledBy ? " by " + k.disabledBy : ""}`, cls:"bad" });
  if (k.status === "revoked") r.push({ t:"revoked", cls:"bad" });
  if (!k.lock && k.kind !== "canary") r.push({ t:"open to any address", cls:"warn" });
  if (k.expires <= 7) r.push({ t:`expires in ${k.expires} d`, cls:"warn" });
  if (k.spend && k.spend.monthCap && k.spend.month / k.spend.monthCap >= 0.8) r.push({ t:`${Math.round(100*k.spend.month/k.spend.monthCap)}% of monthly cap`, cls:"warn" });
  if (k.projected && k.spend.monthCap && k.projected > k.spend.monthCap) r.push({ t:`projected ${money(k.projected)} > cap`, cls:"warn" });
  if (k.spend && !k.spend.dayCap && !k.spend.monthCap) r.push({ t:"no spend cap", cls:"warn" });

}
function lockText(k) {
  if (k.kind === "canary") return "canary";

function bar(spent, cap, soft) {

}
function spendCell(k) {

}
const sev = s => `<span class="sev ${s}">${s}</span>`;

const CLI = {

// ======================================================================
// Actions (stubs over in-memory state; each records audit + CLI line)

function record(cmd, actor = "owner") { S.lastCli = cmd; S.audit.unshift({ t: clock(), actor, what: cmd.replace(/^kman /, "") }); }
function toast(msg) { S.toast = msg; render(); setTimeout(() => { if (S.toast === msg) { S.toast = null; render(); } }, 2600); }
function tl(i, what) { i.timeline.push({ t: clock(), what }); }
const A = {
  ack(id) { const i = inc(id); i.state = "acknowledged"; tl(i, "Acknowledged by owner. Repeats stop alerting; escalations still alert."); record(CLI.ack(id)); toast(`${id} acknowledged`); },
  thiswasme(id, wide) {
    const i = inc(id), k = key(i.key);
    const src = k.callers.filter(c => !k.known.some(n => c.where.includes(n.what))).slice(-1)[0];
    if (src) k.known.push({ what: src.where.split(" · ")[1] ? src.where.split(" · ")[1].split(" ")[0] : src.ip, label: "added from " + id, scope: wide ? "install" : "key" });
    i.state = "resolved"; i.resolution = "false positive"; tl(i, `Resolved as false positive by owner. Source added as known source (${wide ? "install-wide" : "this key"}). Held-out events added to baseline.`);
    record(CLI.thiswasme(id, wide)); S.panel = null; toast(`${id} resolved: false positive`);
  },
  resolve(id, as) { const i = inc(id); i.state = "resolved"; i.resolution = as; tl(i, `Resolved as ${as} by owner.${as === "confirmed" ? " Held-out events discarded from baseline." : ""}`); record(CLI.resolve(id, as)); S.panel = null; toast(`${id} resolved: ${as}`); },
  disable(name, id) { const k = key(name); k.status = "disabled"; k.disabledBy = "owner"; if (id) tl(inc(id), "Key disabled by owner. Incident stays open."); record(CLI.disable(name, id)); S.panel = null; toast(`${name} disabled. Takes effect on the next request.`); },
  enable(name) { const k = key(name); k.status = "active"; k.disabledBy = null; const i = incOfKey(name); if (i) tl(i, "Key re-enabled by owner. Auto-disable paused for 1 h."); record(CLI.enable(name)); toast(`${name} re-enabled. Auto-disable paused 1 h.`); },
  rotate(name, grace, id) {
    const k = key(name); const s = newSecret(k);
    k.rotations.unshift({ at: "2026-11-03 " + clock(), by: "owner", grace }); k.grace = grace === "0" ? null : { until: "in " + grace };
    if (id) { const i = inc(id); i.state = "resolved"; i.resolution = "confirmed"; tl(i, `Key rotated (grace ${grace}). Resolved as confirmed. The old secret will be watched as a retired secret for 30 days.`); }
    record(CLI.rotate(name, grace, id)); S.panel = null;
    S.reveal = { title: `New secret for ${name}`, note: grace === "0" ? "The previous secret stopped working immediately." : `The previous secret keeps working ${"for " + grace}, then becomes a retired secret.`, items: [{ name, secret: s }] };
    render();
  },
  revoke(name, id) { const k = key(name); k.status = "revoked"; if (id) { const i = inc(id); i.state = "resolved"; i.resolution = "confirmed"; tl(i, "Key revoked. Resolved as confirmed."); } record(CLI.revoke(name, id)); S.panel = null; toast(`${name} revoked permanently`); },
  compromise(credId, id) {
    const c = S.credentials.find(x => x.id === credId); c.replaced = clock(); c.hint = c.hint.split("…")[0] + "…" + rnd(4);
    const ks = keysOnCred(credId).filter(k => k.kind !== "canary");
    const items = ks.map(k => { k.rotations.unshift({ at: "2026-11-03 " + clock(), by: "owner", grace: "0 (compromise)" }); k.grace = null; return { name: k.name, secret: newSecret(k), apps: k.callers.map(x => x.ua).join(", ") }; });
    S.incidents.filter(i => i.state !== "resolved" && ks.some(k => k.name === i.key)).forEach(i => { i.state = "resolved"; i.resolution = "confirmed"; tl(i, `Credential ${credId} compromised: credential replaced, key rotated with no grace. Resolved as confirmed.`); });
    record(CLI.compromise(credId, id)); S.panel = null;
    S.reveal = { title: `Credential ${credId} replaced`, note: `${ks.length} virtual keys were rotated with no grace period. Canaries on this credential keep their secrets. Give each app its new key:`, items };
    render();
  },
  addUpstream(preset, name, base) { S.upstreams.push({ id: name, preset, base, profile: ["openai","anthropic","gemini"].includes(preset) ? preset : "generic" }); record(CLI.upstreamAdd(preset, name, base)); S.ui.wizard = 2; render(); },
  addCred(name, up) { S.credentials.push({ id: name, upstream: up, hint: "…" + rnd(4), added: "2026-11-03", replaced: null }); record(CLI.credAdd(name, up)); S.ui.wizard = 3; render(); },
  knownAdd(what, label, k) { const t = k ? key(k) : null; if (t) t.known.push({ what, label, scope: "key" }); else S.keys.forEach(x => x.known.push({ what, label, scope: "install" })); record(CLI.knownAdd(what, label, k)); toast(`known source ${what} added`); },
};

function confirmPanel(p) {
  const i = p.incId ? inc(p.incId) : null;
  const k = p.keyName ? key(p.keyName) : null;
  const wrap = (title, body, cmd, btn) => `<div class="confirm"><h4>${title}</h4>${body}<code class="cli">${esc(cmd)}</code><div class="row" style="margin-top:10px">${btn}<button class="btn" data-act="closePanel">Cancel</button></div></div>`;
  switch (p.type) {
    case "disable": return wrap(`Disable ${k.name}?`, `<ul><li>Every request with this key is refused from the next request on.</li><li>The key, its policy, spend and baseline are kept. You can re-enable it.</li>${i ? `<li>${i.id} stays open: disabling can be undone, so you may still be investigating.</li>` : ""}</ul>`, CLI.disable(k.name, i && i.id), `<button class="btn danger solid" data-act="disable" data-k="${k.name}" data-i="${i ? i.id : ""}">Disable key</button>`);
    case "rotate": return wrap(`Rotate ${k.name}?`, `<ul><li>Same key id <code>${k.id}</code>; spend, baseline, incidents and history stay.</li><li>The new secret is shown once.</li><li>After the grace period the old secret becomes a <b>retired secret</b>: refused, and any use raises a high detection.</li>${i ? `<li>Resolves ${i.id} as confirmed.</li>` : ""}</ul><div class="field"><label>Grace period for the previous secret</label><select id="grace"><option value="0">0: stop it now (suspected leak)</option><option value="1h">1 hour</option><option value="24h" selected>24 hours</option></select></div>`, CLI.rotate(k.name, "24h", i && i.id), `<button class="btn primary" data-act="rotate" data-k="${k.name}" data-i="${i ? i.id : ""}">Rotate</button>`);
    case "revoke": return wrap(`Revoke ${k.name}?`, `<ul><li><b>Permanent.</b> The key can never be used again; history is kept.</li><li>Apps using it need a new key.</li>${i ? `<li>Resolves ${i.id} as confirmed.</li>` : ""}</ul>`, CLI.revoke(k.name, i && i.id), `<button class="btn danger solid" data-act="revoke" data-k="${k.name}" data-i="${i ? i.id : ""}">Revoke permanently</button>`);
    case "compromise": {
      const c = p.cred || credOf(k).id; const ks = keysOnCred(c).filter(x => x.kind !== "canary");
      return wrap(`Credential compromise: ${c}`, `<p class="small">Use this when the <b>real</b> ${esc(S.credentials.find(x => x.id === c).upstream)} key itself leaked. First revoke it at the provider and create a new one.</p><div class="field"><label>New ${esc(S.credentials.find(x => x.id === c).upstream)} secret (masked, never shown back)</label><input type="password" id="newsecret" placeholder="paste the new provider key" autocomplete="off"></div><ul><li>Replaces the credential in one step.</li><li>Rotates these ${ks.length} virtual keys with <b>no grace</b>: ${ks.map(x => `<code>${x.name}</code>`).join(", ")}.</li><li>Lists the apps that need their new key.</li></ul>`, CLI.compromise(c, i && i.id), `<button class="btn danger solid" data-act="compromise" data-c="${c}" data-i="${i ? i.id : ""}">Replace credential and rotate ${ks.length} keys</button>`);
    }
    case "thiswasme": {
      const src = k.callers.slice(-1)[0];

    }

  }
  return "";

  const oi = openIncs();
  const nav = [["keys","Keys",""],["incidents","Incidents",oi.length],["feed","Live feed",""],["upstreams","Upstreams & credentials",""],["audit","Audit log",""]];
  const sec = r.sec || "keys";
  const crit = oi.filter(i => i.sev === "critical" || i.sev === "high");
  const banners = `<div class="banners">${crit.map(i => `<div class="banner crit"><span>${sev(i.sev)} <b>${i.key}</b>: ${i.rules.join(", ")} <span class="muted small">${i.id} · opened ${i.opened}</span></span><a class="btn" href="${go("incidents/" + i.id)}">Respond</a></div>`).join("")}
    ${S.keys.filter(k => risks(k).some(x => x.cls === "warn") && !incOfKey(k.name)).slice(0,3).map(k => `<div class="banner"><span><b>${k.name}</b>: ${pills(risks(k).filter(x => x.cls === "warn"))}</span><a class="btn" href="${go("keys/" + k.name)}">Review</a></div>`).join("")}</div>`;
  let body = "";
  if (sec === "keys" && !r.id) {
    body = `<div class="row"><h1 class="grow">Keys</h1><button class="btn primary" data-act="todo" data-what="${CLI.keyCreate("&lt;name&gt;", "&lt;credential&gt;")}">+ New key</button><button class="btn" data-act="todo" data-what="kman canary create --format env">+ Canary</button></div>${banners}
    <div class="card"><table><tr><th>Name</th><th>Upstream</th><th>Lock</th><th>Expires</th><th>Last seen</th><th>Spend this month</th><th>Status</th></tr>
    ${S.keys.map(k => `<tr class="click" data-go="${go("keys/" + k.name)}"><td><b>${k.name}</b><div class="mono small muted">${k.id}${k.kind === "canary" ? " · canary" : ""}</div></td><td>${credOf(k).upstream}</td><td class="small">${k.lock || k.kind === "canary" ? esc(lockText(k)) : `<span class="pill warn">open</span>`}</td><td>${k.expires <= 7 ? `<span class="pill warn">${k.expires} d</span>` : k.expires + " d"}</td><td class="small">${k.lastSeen}</td><td>${spendCell(k)}</td><td>${pills(risks(k).filter(x => x.cls === "bad" || x.t.startsWith("previous")))}${k.status === "active" && !risks(k).some(x => x.cls === "bad") ? `<span class="pill good">active</span>` : ""}</td></tr>`).join("")}</table></div>`;
  } else if (sec === "keys") {
    const k = key(r.id); const t = S.ui.tab;
    const tabs = [["overview","Overview"],["callers","Callers"],["incidents","Incidents"],["policy","Policy"],["known","Known sources"],["rotation","Rotation"]];
    const kincs = S.incidents.filter(i => i.key === k.name);
    let tb = "";
    if (t === "overview") tb = `<div class="split"><div class="panel"><h3>Spend</h3>${k.spend ? `<p>Today ${money(k.spend.day)} ${k.spend.dayCap ? "of " + money(k.spend.dayCap) : ""}</p>${bar(k.spend.day, k.spend.dayCap, k.spend.soft)}<p>This month ${money(k.spend.month)} ${k.spend.monthCap ? "of " + money(k.spend.monthCap) : ""} ${k.projected ? `<span class="pill warn">projected ${money(k.projected)}</span>` : ""}</p>${bar(k.spend.month, k.spend.monthCap, k.spend.soft)}<p class="small muted">Ticks mark the soft-budget thresholds.</p>` : `<p class="muted">Not metered.</p>`}<h3 style="margin-top:14px">Recent detections</h3>${S.detections.filter(d => d.key === k.name).slice(0,5).map(d => `<div class="small">${d.t} ${sev(d.sev)} ${d.rule}: ${esc(d.ev)}</div>`).join("") || `<p class="muted">None.</p>`}</div><div class="panel"><h3>At a glance</h3>${pills(risks(k)) || `<span class="pill good">nothing at risk</span>`}<p class="small">Last seen ${k.lastSeen}${k.realtime ? ` · ${k.realtime.sessions} live realtime sessions, ${k.realtime.children} child keys` : ""}</p></div></div>`;
    if (t === "callers") tb = `<div class="card">${callersTable(k)}</div>`;
    if (t === "incidents") tb = `<div class="card"><table><tr><th>Incident</th><th>Severity</th><th>Rules</th><th>State</th></tr>${kincs.map(i => `<tr class="click" data-go="${go("incidents/" + i.id)}"><td>${i.id}</td><td>${sev(i.sev)}</td><td>${i.rules.join(", ")}</td><td>${statePill(i)}</td></tr>`).join("") || `<tr><td colspan="4" class="muted">No incidents.</td></tr>`}</table></div>`;
    if (t === "policy") tb = `<div class="card">${policyBlock(k)}</div><p class="small muted">Edit opens a form; every field maps to <code>kman key set ${k.name} …</code></p>`;
    if (t === "known") tb = `<div class="card" style="padding:8px 12px">${knownBlock(k)}</div>`;
    if (t === "rotation") tb = `<div class="card" style="padding:8px 12px">${rotationBlock(k)}</div>`;
    body = `<div class="small"><a href="${go("keys")}">Keys</a> /</div><div class="row"><h1 class="grow">${k.name} <span class="mono small muted">${k.id}</span></h1>
      ${k.status === "disabled" ? `<button class="btn" data-act="enable" data-k="${k.name}">Enable</button>` : k.status === "active" ? `<button class="btn danger" data-panel="disable" data-k="${k.name}">Disable</button>` : ""}
      ${k.status !== "revoked" ? `<button class="btn" data-panel="rotate" data-k="${k.name}">Rotate</button><button class="btn danger" data-panel="revoke" data-k="${k.name}">Revoke</button>` : ""}</div>
      <div class="tabs">${tabs.map(x => `<a href="javascript:void 0" data-tab="${x[0]}" class="${t === x[0] ? "on" : ""}">${x[1]}${x[0] === "incidents" && kincs.some(i => i.state !== "resolved") ? " •" : ""}</a>`).join("")}</div>${tb}`;
  } else if (sec === "incidents" && !r.id) {
    const f = S.ui.incFilter; const list = f === "open" ? oi : S.incidents;
    body = `<div class="row"><h1 class="grow">Incidents</h1><select data-filter="1"><option value="open" ${f === "open" ? "selected" : ""}>Open and acknowledged</option><option value="all" ${f === "all" ? "selected" : ""}>All</option></select></div>
      <div class="card"><table><tr><th>Incident</th><th>Key</th><th>Severity</th><th>Rules</th><th>Detections</th><th>Opened</th><th>State</th></tr>${list.map(i => `<tr class="click" data-go="${go("incidents/" + i.id)}"><td class="mono">${i.id}</td><td><b>${i.key}</b></td><td>${sev(i.sev)}</td><td class="small">${i.rules.join(", ")}</td><td>${i.dets}</td><td class="small">${i.opened}</td><td>${statePill(i)}</td></tr>`).join("")}</table></div>`;
  } else if (sec === "incidents") {
    const i = inc(r.id); const k = key(i.key); const done = i.state === "resolved";
    body = `<div class="small"><a href="${go("incidents")}">Incidents</a> /</div><div class="row"><h1 class="grow">${sev(i.sev)} ${i.id}: <a href="${go("keys/" + k.name)}">${k.name}</a></h1>${statePill(i)}</div>
    <div class="split"><div><div class="panel"><h3>Evidence</h3><p>${esc(i.evidence)}</p><p class="small">Rules: ${i.rules.map(x => `<span class="pill">${x}</span>`).join(" ")} · ${i.dets} detections · key is <b>${k.status}</b></p></div>${dryRunNote(i)}<div class="panel" style="margin-top:12px"><h3>Timeline</h3>${timelineList(i)}</div></div>
    <div class="panel"><h3>Respond</h3>${done ? `<p class="muted">Resolved: ${i.resolution}.</p>` : `<div class="actions">
      ${i.state === "open" ? `<button class="btn" data-act="ack" data-i="${i.id}">Acknowledge <span class="muted small">· stop repeat alerts</span></button>` : ""}
      ${k.kind !== "canary" ? `<button class="btn" data-panel="thiswasme" data-k="${k.name}" data-i="${i.id}">This was me…</button>` : ""}
      ${k.status === "active" ? `<button class="btn danger" data-panel="disable" data-k="${k.name}" data-i="${i.id}">Disable key…</button>` : `<button class="btn" data-act="enable" data-k="${k.name}">Re-enable key</button>`}
      <button class="btn" data-panel="rotate" data-k="${k.name}" data-i="${i.id}">Rotate key…</button>
      <button class="btn danger" data-panel="revoke" data-k="${k.name}" data-i="${i.id}">Revoke key…</button>
      <button class="btn danger" data-panel="compromise" data-k="${k.name}" data-i="${i.id}">Credential compromise…</button>
      <button class="btn" data-panel="resolve" data-i="${i.id}">Resolve…</button></div>`}
      <p class="small muted" style="margin-top:12px">Stable link used in alerts: <code>${realPath()}</code></p></div></div>`;
  } else if (sec === "feed") {
    body = `<div class="row"><h1 class="grow">Live feed</h1><span class="small muted">${S.live ? "● streaming (SSE)" : "paused"}</span><button class="btn" data-act="live">${S.live ? "Pause" : "Resume"}</button></div><p class="small muted">Same stream as <code>kman detections --follow</code>. Low severity is shown here but not sent to channels.</p>
    <div class="card"><table><tr><th>Time</th><th>Severity</th><th>Key</th><th>Rule</th><th>Evidence</th><th>Incident</th></tr>${S.detections.slice(0, 30).map(d => `<tr class="click" data-go="${go("incidents/" + d.inc)}" style="${d.fresh ? "background:#eef7ee" : ""}"><td class="mono small">${d.t}</td><td>${sev(d.sev)}</td><td>${d.key}</td><td>${d.rule}</td><td class="small">${esc(d.ev)}</td><td class="mono small">${d.inc}</td></tr>`).join("")}</table></div>`;
  } else if (sec === "upstreams" && r.id === "new") {
    const w = S.ui.wizard;
    body = `<div class="small"><a href="${go("upstreams")}">Upstreams</a> /</div><h1>Add an upstream and credential</h1><div class="steps"><span class="${w === 1 ? "on" : ""}">1 · Upstream</span><span class="${w === 2 ? "on" : ""}">2 · Credential</span><span class="${w === 3 ? "on" : ""}">3 · First key</span></div>
    <div class="panel" style="max-width:560px">${w === 1 ? `<form data-form="upstream"><div class="field"><label>Preset (21)</label><select name="preset">${PRESETS.map(p => `<option ${p === S.ui.wizardPreset ? "selected" : ""}>${p}</option>`).join("")}</select></div><div class="field"><label>Name</label><input name="name" value="openai-eu"></div><div class="field"><label>Base URL (fixed by the preset; change only for proxies or regions)</label><input name="base" value="https://eu.api.openai.com"></div><button class="btn primary">Add upstream</button></form>`
      : w === 2 ? `<form data-form="cred"><input type="hidden" name="up" value="${S.upstreams.slice(-1)[0].id}"><div class="field"><label>Credential name</label><input name="name" value="${S.upstreams.slice(-1)[0].id}-main"></div><div class="field"><label>Secret: masked, encrypted at rest, never shown again</label><input type="password" name="secret" placeholder="sk-…" autocomplete="off"></div><button class="btn primary">Save credential</button></form>`
      : `<p>✓ Upstream and credential saved.</p><p>Next: create a virtual key for your app.</p><code class="cli">${esc(CLI.keyCreate("my-app", S.credentials.slice(-1)[0].id))}</code><div class="row" style="margin-top:10px"><a class="btn" href="${go("upstreams")}" data-act="wizardReset">Done</a></div>`}
      <p class="small muted" style="margin-top:10px">Last command: <code>${esc(S.lastCli || "")}</code></p></div>`;
  } else if (sec === "upstreams") {
    body = `<div class="row"><h1 class="grow">Upstreams & credentials</h1><a class="btn primary" href="${go("upstreams/new")}" data-act="wizardReset">+ Add upstream</a></div>
    <div class="card"><table><tr><th>Upstream</th><th>Base URL</th><th>Credential</th><th>Secret</th><th>Keys</th><th></th></tr>${S.credentials.map(c => { const u = S.upstreams.find(x => x.id === c.upstream); return `<tr><td><b>${u.id}</b> <span class="muted small">${u.preset}</span></td><td class="mono small">${u.base}</td><td>${c.id}</td><td class="mono small">${c.hint}${c.replaced ? ` <span class="pill good">replaced ${c.replaced}</span>` : ""}</td><td>${keysOnCred(c.id).length}</td><td><button class="btn danger" data-panel="compromise" data-c="${c.id}">Compromised…</button></td></tr>`; }).join("")}</table></div>`;
  } else if (sec === "audit") {
    body = `<h1>Audit log</h1><p class="small muted">Same as <code>kman audit --follow</code>.</p><div class="card"><table><tr><th>Time</th><th>Actor</th><th>Change</th></tr>${S.audit.map(a => `<tr><td class="mono small">${a.t}</td><td>${a.actor}</td><td class="mono small">${esc(a.what)}</td></tr>`).join("")}</table></div>`;
  }
  return `<div class="A"><nav><div class="brand">kman</div>${nav.map(n => `<a href="${go(n[0])}" class="${sec === n[0] ? "on" : ""}">${n[1]}${n[2] ? `<span class="n">${n[2]}</span>` : ""}</a>`).join("")}<div class="foot">owner · 127.0.0.1:8081<br>v0.3.0 · 8 keys · 3 upstreams</div></nav><main>${body}</main></div>${S.panel ? `<div class="overlay" data-act="closePanel"><div class="dialog" data-stop="1">${confirmPanel(S.panel)}</div></div>` : ""}`;
}};

// ======================================================================
// Variant B: triage inbox (attention list + detail pane, guided playbook)
// ======================================================================
const VariantB = { name: "Triage inbox", render(r) {
  const oi = openIncs();
  const attention = [
    ...oi.map(i => ({ kind: "inc", sev: i.sev, href: go("incidents/" + i.id), id: i.id, title: `${i.key}`, sub: `${i.rules.join(" + ")} · ${i.dets} detections`, right: statePill(i) })),
    ...S.keys.filter(k => !incOfKey(k.name) && risks(k).some(x => x.cls)).map(k => ({ kind: "key", sev: "", href: go("keys/" + k.name), id: k.name, title: k.name, sub: risks(k).filter(x => x.cls).map(x => x.t).join(" · "), right: "" })),
  ];
  const sec = r.sec || "attention";
  const listSec = sec === "incidents" || sec === "attention" ? "attention" : sec === "keys" ? "keys" : sec === "upstreams" ? "upstreams" : sec;
  const rail = [["attention","Needs attention",attention.length],["keys","Keys",S.keys.length],["upstreams","Upstreams",S.upstreams.length],["feed","Live feed",""],["audit","Audit log",""]];
  let list = "";
  const sel = r.id;
  if (listSec === "attention") list = `<div class="head"><span>Needs attention</span><span class="small muted">most severe first</span></div>${attention.map(a => `<div class="item ${a.sev} ${sel === a.id ? "on" : ""}" data-go="${a.href}"><div class="t"><span>${a.sev ? sev(a.sev) + " " : ""}<b>${a.title}</b></span>${a.right}</div><div class="s">${esc(a.sub)}</div></div>`).join("")}
    <div class="head" style="position:static"><span class="small muted">Recently resolved</span></div>${S.incidents.filter(i => i.state === "resolved").map(i => `<div class="item ${sel === i.id ? "on" : ""}" data-go="${go("incidents/" + i.id)}"><div class="t"><span class="muted">${i.key}</span><span class="small muted">${i.resolution}</span></div><div class="s">${i.rules.join(", ")}</div></div>`).join("")}`;
  if (listSec === "keys") list = `<div class="head"><span>Keys</span><button class="btn" data-act="todo" data-what="${CLI.keyCreate("&lt;name&gt;", "&lt;credential&gt;")}">+ New</button></div>${S.keys.map(k => `<div class="item ${sel === k.name ? "on" : ""}" data-go="${go("keys/" + k.name)}"><div class="t"><b>${k.name}</b><span class="small muted">${k.lastSeen}</span></div><div class="s">${esc(lockText(k))} · ${k.spend && k.spend.monthCap ? `${money(k.spend.month)} of ${money(k.spend.monthCap)}` : k.kind === "canary" ? "canary" : "no cap"}</div>${risks(k).length ? `<div style="margin-top:4px">${pills(risks(k))}</div>` : ""}</div>`).join("")}`;
  if (listSec === "upstreams") list = `<div class="head"><span>Upstreams</span><a class="btn" href="${go("upstreams/new")}" data-act="wizardReset">+ Add</a></div>${S.credentials.map(c => `<div class="item ${sel === c.id ? "on" : ""}" data-go="${go("upstreams/" + c.id)}"><div class="t"><b>${c.upstream}</b><span class="mono small">${c.hint}</span></div><div class="s">credential ${c.id} · ${keysOnCred(c.id).length} keys</div></div>`).join("")}`;
  if (listSec === "feed" || listSec === "audit") list = `<div class="head"><span>${listSec === "feed" ? "Live feed" : "Audit log"}</span></div><div class="item"><div class="s">Shown full-width on the right.</div></div>`;

  let pane = "";
  const inline = (t) => S.panel && S.panel.type === t ? confirmPanel(S.panel) : "";
  if (sec === "incidents" && sel) {
    const i = inc(sel); const k = key(i.key); const c = credOf(k);
    const done = i.state === "resolved";
    const step = (cls, title, body) => `<li class="${cls}"><h4>${title}</h4>${body}</li>`;
    pane = `<div class="row"><h1 class="grow">${sev(i.sev)} ${k.name}</h1>${statePill(i)}</div><div class="muted small">${i.id} · opened ${i.opened} · ${i.rules.join(", ")} · ${i.dets} detections · link in alerts: <code>${realPath()}</code></div>
    <p>${esc(i.evidence)}</p>${dryRunNote(i)}
    ${done ? `<div class="confirm">Resolved: <b>${i.resolution}</b>.</div>` : `<ol class="play">
      ${step(i.state !== "open" ? "done" : "", "Seen it", i.state === "open" ? `<p class="small">Acknowledge to stop repeat alerts. Escalations still alert.</p><button class="btn" data-act="ack" data-i="${i.id}">Acknowledge</button>` : `<p class="small muted">Acknowledged.</p>`)}
      ${k.kind === "canary" ? step("", "This is a canary", `<p class="small">Nobody legitimate uses a canary. Whoever used it read <code>${esc(k.canary.planted)}</code>. Find what else lived there.</p>`) : step("", "Was this you?", `<p class="small">A new CI runner, VPN or office?</p><button class="btn" data-panel="thiswasme" data-k="${k.name}" data-i="${i.id}">Yes, this was me</button>${inline("thiswasme")}`)}
      ${k.kind === "canary" ? "" : step(k.status !== "active" ? "done" : "", "Contain: stop the key now", k.status === "active" ? `<p class="small">Reversible. The incident stays open.</p><button class="btn danger" data-panel="disable" data-k="${k.name}" data-i="${i.id}">Disable ${k.name}</button>${inline("disable")}` : `<p class="small muted">${k.name} is ${k.status}. <button class="btn" data-act="enable" data-k="${k.name}">Re-enable</button></p>`)}
      ${step("", "Replace the secret", `<p class="small">Rotate keeps the key and its history; revoke ends it. Either resolves the incident as confirmed.</p><div class="row"><button class="btn primary" data-panel="rotate" data-k="${k.name}" data-i="${i.id}">Rotate</button><button class="btn danger" data-panel="revoke" data-k="${k.name}" data-i="${i.id}">Revoke</button></div>${inline("rotate")}${inline("revoke")}`)}
      ${step("", `Did the real ${c.upstream} key leak too?`, `<p class="small">Only if the attacker could have read kman's data or the provider key itself. Replaces <code>${c.id}</code> and rotates all ${keysOnCred(c.id).filter(x => x.kind !== "canary").length} keys on it.</p><button class="btn danger" data-panel="compromise" data-k="${k.name}" data-i="${i.id}">Credential compromise</button>${inline("compromise")}`)}
      ${step("", "Close it", `<button class="btn" data-panel="resolve" data-i="${i.id}">Resolve…</button>${inline("resolve")}`)}
    </ol>`}
    <section><h3>Timeline</h3>${timelineList(i)}</section>`;
  } else if (sec === "keys" && sel) {
    const k = key(sel); const ki = incOfKey(k.name);
    pane = `<div class="row"><h1 class="grow">${k.name}</h1>${k.status === "disabled" ? `<button class="btn" data-act="enable" data-k="${k.name}">Enable</button>` : k.status === "active" ? `<button class="btn danger" data-panel="disable" data-k="${k.name}">Disable</button>` : ""}${k.status !== "revoked" ? `<button class="btn" data-panel="rotate" data-k="${k.name}">Rotate</button><button class="btn danger" data-panel="revoke" data-k="${k.name}">Revoke</button>` : ""}</div>
    <div class="mono small muted">${k.id} · ${credOf(k).upstream} / ${k.cred} · last seen ${k.lastSeen}</div>
    ${["disable","rotate","revoke"].map(inline).join("")}
    ${ki ? `<div class="confirm" style="border-color:#f1b9b5;background:#fdecea">${sev(ki.sev)} Open incident <a href="${go("incidents/" + ki.id)}">${ki.id}</a>: ${ki.rules.join(", ")}</div>` : ""}
    <div class="gauges"><div class="gauge"><div class="small muted">Today</div><div class="v">${k.spend ? money(k.spend.day) : "–"}</div>${k.spend ? bar(k.spend.day, k.spend.dayCap, k.spend.soft) : ""}</div><div class="gauge"><div class="small muted">This month</div><div class="v">${k.spend ? money(k.spend.month) : "–"}</div>${k.spend ? bar(k.spend.month, k.spend.monthCap, k.spend.soft) : ""}</div><div class="gauge"><div class="small muted">Expires</div><div class="v">${k.expires} d</div><div class="small">${k.lock ? "locked to " + esc(lockText(k)) : k.kind === "canary" ? "canary" : `<span class="pill warn">open to any address</span>`}</div></div></div>
    <section><h3>Callers, last 7 days</h3>${callersTable(k)}</section>
    <section><h3>Incidents</h3>${S.incidents.filter(i => i.key === k.name).map(i => `<div class="row" style="padding:3px 0"><a href="${go("incidents/" + i.id)}" class="mono">${i.id}</a>${sev(i.sev)}<span class="small">${i.rules.join(", ")}</span>${statePill(i)}</div>`).join("") || `<p class="muted">None.</p>`}</section>
    <section><h3>Policy</h3>${policyBlock(k)}</section>
    <section><h3>Known sources</h3>${knownBlock(k)}</section>
    <section><h3>Rotation history</h3>${rotationBlock(k)}</section>`;
  } else if (sec === "upstreams" && sel === "new") {
    const w = S.ui.wizard;

// Tiny command parser for variant C (subset of the real CLI)
function runCommand(line) {
  const t = (line.match(/"[^"]*"|\S+/g) || []).map(x => x.replace(/^"|"$/g, ""));
  if (t[0] === "kman") t.shift();
  const flag = f => { const i = t.indexOf(f); return i >= 0 ? (t[i + 1] && !t[i + 1].startsWith("--") ? t[i + 1] : true) : null; };
  const [a, b, c] = t;
  try {
    if (a === "incidents") return nav(go("incidents/" + (openIncs()[0] || {}).id));
    if (a === "incident" && b === "ack") return A.ack(c);
    if (a === "incident" && b === "this-was-me") return A.thiswasme(c, !!flag("--install-wide"));
    if (a === "incident" && b === "resolve") return A.resolve(c, flag("--as") || "confirmed");
    if (a === "key" && b === "disable") return (S.panel = { type: "disable", keyName: c, incId: flag("--incident") || null }, render());
    if (a === "key" && b === "enable") return A.enable(c);
    if (a === "key" && b === "rotate") return A.rotate(c, flag("--grace") || "24h", flag("--incident") || null);
    if (a === "key" && b === "revoke") return (S.panel = { type: "revoke", keyName: c, incId: flag("--incident") || null }, render());
    if (a === "credential" && b === "compromise") return (S.panel = { type: "compromise", cred: c, incId: flag("--incident") || null }, render());
    if (a === "known-source" && b === "add") return A.knownAdd(c, flag("--label") || "", flag("--key"));
    if (a === "upstream" && b === "add") { S.ui.wizard = 1; return nav(go("upstreams/new")); }
  } catch (e) { return toast("error: " + e.message); }
  toast(`prototype doesn't simulate: ${line}`);
}

const VARIANTS = { A: VariantA, B: VariantB, C: VariantC };
const KEYS = Object.keys(VARIANTS);
let curVariant = (() => { try { const v = new URLSearchParams(location.search).get("variant"); return KEYS.includes(v) ? v : "A"; } catch (e) { return "A"; } })();
const variant = () => curVariant;
function setVariant(v) { curVariant = v; try { const u = new URL(location.href); u.searchParams.set("variant", v); history.replaceState(null, "", u); } catch (e) {} S.panel = null; render(); }
let stateOpen = false;
function render() {
  const v = variant(), r = route();
  const focused = document.activeElement && document.activeElement.id;
  const typed = document.getElementById("cmdline"); if (typed) S.ui.cmd = typed.value;
  // don't clobber a form the user is typing into
  if (document.activeElement && ["INPUT","SELECT","TEXTAREA"].includes(document.activeElement.tagName) && document.activeElement.id !== "cmdline" && document.activeElement.closest("#app")) { renderChrome(v, r); return; }
  document.getElementById("app").innerHTML = VARIANTS[v].render(r);
  if (focused === "cmdline") { const el = document.getElementById("cmdline"); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  renderChrome(v, r);
}
function renderChrome(v, r) {
  document.getElementById("switcher").innerHTML = `<button data-sw="-1" title="previous (←)">‹</button><span>PROTOTYPE · ${v} (${VARIANTS[v].name})</span><button data-sw="1" title="next (→)">›</button>`;

  const ov = document.getElementById("overlays");
  ov.innerHTML = (S.toast ? `<div class="toast">${esc(S.toast)}</div>` : "") + (S.reveal ? `<div class="overlay"><div class="dialog"><h3 style="margin-top:0">${esc(S.reveal.title)}</h3><p>${esc(S.reveal.note)}</p>${S.reveal.items.map(x => `<div style="margin:10px 0"><b>${x.name}</b>${x.apps ? ` <span class="small muted">used by ${esc(x.apps)}</span>` : ""}<div class="secret">${x.secret}</div></div>`).join("")}<p class="small"><b>Shown once.</b> kman keeps only a hash. Copy it now.</p><code class="cli">${esc(S.lastCli)}</code><div class="row" style="margin-top:10px"><button class="btn primary" data-act="closeReveal">I've copied it</button></div></div></div>` : "");

document.addEventListener("click", e => {
  const link = e.target.closest('a[href^="#/"]');
  if (link) { e.preventDefault(); if (link.dataset.act === "wizardReset") S.ui.wizard = 1; return nav(link.getAttribute("href")); }
  const el = e.target.closest("[data-act],[data-go],[data-sw],[data-panel],[data-tab],[data-expand],[data-cmd]");
  if (!el) return;
  if (el.dataset.stop && !e.target.closest("[data-act]")) return;
  const d = el.dataset;
  if (d.sw) { const i = KEYS.indexOf(variant()); return setVariant(KEYS[(i + Number(d.sw) + KEYS.length) % KEYS.length]); }
  if (d.go) return nav(d.go);
  if (d.tab) { S.ui.tab = d.tab; return render(); }
  if (d.expand) { S.ui.expanded = S.ui.expanded === d.expand ? null : d.expand; return render(); }
  if (d.cmd) { S.ui.cmd = d.cmd; render(); const el2 = document.getElementById("cmdline"); if (el2) { el2.value = d.cmd; el2.focus(); } return; }
  if (d.panel) { S.panel = { type: d.panel, keyName: d.k || null, incId: d.i || null, cred: d.c || null }; return render(); }
  const i = d.i || null;
  switch (d.act) {
    case "closePanel": if (e.target === el || el.tagName === "BUTTON") { S.panel = null; render(); } return;
    case "closeReveal": S.reveal = null; return render();
    case "statebox": stateOpen = !stateOpen; return render();
    case "live": S.live = !S.live; return render();
    case "wizardReset": S.ui.wizard = 1; return;
    case "todo": return toast("not prototyped; CLI: " + d.what.replace(/&lt;/g, "<").replace(/&gt;/g, ">"));
    case "ack": return A.ack(i);
    case "enable": return A.enable(d.k);
    case "disable": return A.disable(d.k, i);
    case "revoke": return A.revoke(d.k, i);
    case "rotate": return A.rotate(d.k, (document.getElementById("grace") || {}).value || "24h", i);
    case "thiswasme": return A.thiswasme(i, !!(document.getElementById("wide") || {}).checked);
    case "resolve": return A.resolve(i, (document.getElementById("as") || {}).value || "confirmed");
    case "compromise": return A.compromise(d.c, i);
  }
});
document.addEventListener("change", e => {

  const p = S.panel; if (!p) return; const cli = e.target.closest(".confirm") && e.target.closest(".confirm").querySelector(".cli");
  if (!cli) return;
  if (e.target.id === "grace") cli.textContent = CLI.rotate(p.keyName, e.target.value, p.incId);
  if (e.target.id === "wide") cli.textContent = CLI.thiswasme(p.incId, e.target.checked);
  if (e.target.id === "as") cli.textContent = CLI.resolve(p.incId, e.target.value);
});

  e.preventDefault(); const f = new FormData(e.target); const t = e.target.dataset.form;

  if (t === "cmd") { const v = String(f.get("cmd") || "").trim(); S.ui.cmd = ""; if (document.activeElement) document.activeElement.blur(); if (v) runCommand(v); else render(); }
});
document.addEventListener("keydown", e => {
  const a = document.activeElement;

});
