# The required gates of SPEC §17. The dependency rule, the no-untested-package
# gate and the clock seam run inside go test (package gates), and so does
# the check that the committed admin API OpenAPI document is current
# (internal/adminapi, TestTheOpenAPIDocumentIsCurrent). Branch
# protection requires the "required" job, which passes only when every other
# job passed.
#
# Three gates of SPEC §17 join later, with the code they check: templ generate
# with no diff (the dashboard, M3), and the secret-leak sweep and the canary
# deadline gate (the e2e harness and alerts, M1).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: go vet
        run: |
          go vet ./...
          go -C tools vet ./...
      - name: staticcheck
        run: |
          go tool -modfile=tools/go.mod staticcheck ./...
          go -C tools tool staticcheck ./...
      - name: govulncheck
        run: go tool -modfile=tools/go.mod govulncheck ./...
      - name: go mod tidy has no diff
        run: |
          go mod tidy -diff
          go -C tools mod tidy -diff

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Unit, gate and e2e tests
        run: go test ./...
      - name: Tool tests
        if: runner.os == 'Linux'
        run: go -C tools test ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: go test -race
        env:
          CGO_ENABLED: "1" # -race needs cgo
        run: go test -race ./...

  cross-compile:
    strategy:
      fail-fast: false
      matrix:
        target: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64]
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Build ${{ matrix.target }}
        env:
          CGO_ENABLED: "0"
          TARGET: ${{ matrix.target }}
        run: GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}" go build -trimpath -o /dev/null ./cmd/kman

  bench:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Benchmark the base and the head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          bench() { go test -run '^$' -bench . -benchmem -count 10 ./...; }
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          if [ -f "$RUNNER_TEMP/base/go.mod" ]; then
            (cd "$RUNNER_TEMP/base" && bench) | tee "$RUNNER_TEMP/base.txt"
          else
            echo "The base has no Go module yet; comparing against nothing."
            : > "$RUNNER_TEMP/base.txt"
          fi
          bench | tee "$RUNNER_TEMP/head.txt"
      - name: benchstat
        run: go tool -modfile=tools/go.mod benchstat "$RUNNER_TEMP/base.txt" "$RUNNER_TEMP/head.txt"
      - name: Benchmark gate (allocations, or a slowdown over 10%)
        run: go -C tools run ./benchgate -base "$RUNNER_TEMP/base.txt" -head "$RUNNER_TEMP/head.txt" -max-slowdown 0.10

  systemd-creds:
    # SPEC §17: the systemd-creds key-source tests run on Linux in a
    # container booted with systemd. The vault test binary encrypts a master
    # key with systemd-creds and runs itself as a transient service with
    # LoadCredentialEncrypted= (internal/vault/systemd_linux_test.go).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Build the vault tests
        env:
          CGO_ENABLED: "0"
        run: go test -c -o "$RUNNER_TEMP/kman-systemd/vault.test" ./internal/vault
      - name: Boot systemd in a container
        env:
          IMAGE: ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
        run: |
          docker run -d --name systemd --privileged --cgroupns=private \
            -e container=docker --tmpfs /run --tmpfs /run/lock \
            -v "$RUNNER_TEMP/kman-systemd:/kman:ro" \
            "$IMAGE" bash -c 'apt-get update -qq &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends systemd >/dev/null &&
              exec /usr/lib/systemd/systemd'
          for _ in $(seq 1 90); do
            state=$(docker exec systemd systemctl is-system-running 2>/dev/null || true)
            case "$state" in running|degraded) echo "systemd is $state"; exit 0 ;; esac
            sleep 2
          done
          echo "systemd did not boot (last state: ${state:-none})"
          docker logs systemd | tail -50
          exit 1
      - name: systemd-creds key-source tests
        run: docker exec -e KMAN_TEST_SYSTEMD=1 systemd /kman/vault.test -test.run 'Systemd' -test.v
      - name: Container logs
        if: failure()
        run: |
          docker logs systemd 2>&1 | tail -100
          docker exec systemd journalctl --no-pager -n 100 || true

  required:
    if: always()
    needs: [lint, test, race, cross-compile, systemd-creds, bench]
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Every gate passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
