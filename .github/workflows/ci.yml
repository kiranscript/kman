# The required gates of SPEC §17. The dependency rule, the no-untested-package
# gate and the clock seam run inside go test (package gates), and so does
# the check that the committed admin API OpenAPI document is current
# (internal/adminapi, TestTheOpenAPIDocumentIsCurrent). The docs are gated the
# same way: the generated CLI and admin API references, the doc-to-command and
# link checks (cmd/kman), and the quickstart test, which runs docs/quickstart.md
# line for line on Linux and macOS (e2e, TestTheQuickstartRunsAsWritten). Branch
# protection requires the "required" job, which passes only when every other
# job passed.
#
# The canary deadline gate (e2e, TestCanaryDeadlineGate) is its own
# job below, and also runs with go test. Two gates of SPEC §17 join later, with
# the code they check: templ generate with no diff (the dashboard, M3), and the
# secret-leak sweep (after v0.1.0).
#
# Speed: every job starts at once, so a run takes as long as its slowest job.
# Go's build and test caches come from the last push to main
# (.github/actions/setup-go); the jobs that run only on pull requests, or
# build much what the test job builds, read the Linux test job's. go test
# reuses a package's result when nothing it builds from or reads changed;
# gates that must run every time say -count=1.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache: lint
          extra-paths: ${{ runner.temp }}/staticcheck
      - name: go vet
        run: |
          go vet ./...
          go -C tools vet ./...
      - name: staticcheck
        env:
          STATICCHECK_CACHE: ${{ runner.temp }}/staticcheck
        run: |
          go tool -modfile=tools/go.mod staticcheck ./...
          go -C tools tool staticcheck ./...
      - name: govulncheck
        run: go tool -modfile=tools/go.mod govulncheck ./...
      - name: go mod tidy has no diff
        run: |
          go mod tidy -diff
          go -C tools mod tidy -diff
      - uses: ./.github/actions/save-go-cache

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache: test
      - name: Unit, gate and e2e tests
        run: go test ./...
      - name: Tool tests
        if: runner.os == 'Linux'
        run: go -C tools test ./...
      - uses: ./.github/actions/save-go-cache

  sdk-e2e:
    # SPEC §17: the pinned official SDKs, through the real binary. KMAN_E2E_SDK
    # makes a missing SDK fail instead of skip, which it does in the test job.
    # It runs on Linux only: what's under test is kman, not the SDKs' OS support.
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache: test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the pinned SDKs
        run: e2e/testdata/sdk/install.sh
      - name: SDKs through kman
        env:
          KMAN_E2E_SDK: required
        run: go test -count=1 -run '^(TestOfficialSDKs|TestTheSDKDocSnippets)' ./e2e

  canary-deadline:
    # SPEC §17, M2: a canary's alert, and a disabled key's, arrive within 5 s under
    # 256-way load with another channel hung, on the real binary and the real clock.
    # A job of its own, so that a slow alert is named in the checks and not lost
    # among the unit tests.
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache: test
      - name: Canary deadline gate
        run: go test -count=1 -v -run '^TestCanaryDeadlineGate$' ./e2e

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache: race
      - name: go test -race
        env:
          CGO_ENABLED: "1" # -race needs cgo
        run: go test -race ./...
      - uses: ./.github/actions/save-go-cache

  cross-compile:
    # One job for the five targets: with the cache each build takes seconds,
    # less than starting a runner for it.
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache: cross-compile
      - name: Build linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            echo "::group::$target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -trimpath -o /dev/null ./cmd/kman
            echo "::endgroup::"
          done
      - uses: ./.github/actions/save-go-cache

  bench:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
        with:
          cache: test
      - name: Benchmark the base and the head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/base.txt"
          : > "$RUNNER_TEMP/head.txt"
          # Only the benchmarks the change can move: a package's run when the
          # pull request touches the package, a package of this module it
          # imports, go.mod or go.sum, or the gate itself (this file, tools).
          # The others would time the same code twice.
          pkgs=()
          while read -r pkg dir; do
            grep -qsE '^func Benchmark' "$dir"/*_test.go || continue
            mapfile -t deps < <(go list -deps -test -f '{{.Dir}}' "$pkg" | awk -v root="$PWD/" 'index($0, root) == 1')
            if ! git diff --quiet "$BASE_SHA" HEAD -- go.mod go.sum tools .github/workflows/ci.yml "${deps[@]}"; then
              pkgs+=("$pkg")
            fi
          done < <(go list -f '{{.ImportPath}} {{.Dir}}' ./...)
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "The change reaches no package with benchmarks."
            exit 0
          fi
          printf 'Benchmarking %s\n' "${pkgs[@]}"
          # 250ms a run, ten runs a side: still hundreds of thousands of
          # iterations of the slowest benchmark per run, and a quarter of the
          # time the default second takes.
          bench() { go test -run '^$' -bench . -benchmem -benchtime 250ms -count 10 "$@"; }
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          if [ -f "$RUNNER_TEMP/base/go.mod" ]; then
            # The packages the base has; a new one is compared against nothing.
            mapfile -t basepkgs < <(cd "$RUNNER_TEMP/base" && go list -e -f '{{if not .Error}}{{.ImportPath}}{{end}}' "${pkgs[@]}" | grep .)
            if [ "${#basepkgs[@]}" -gt 0 ]; then
              (cd "$RUNNER_TEMP/base" && bench "${basepkgs[@]}") | tee "$RUNNER_TEMP/base.txt"
            fi
          else
            echo "The base has no Go module yet; comparing against nothing."
          fi
          bench "${pkgs[@]}" | tee "$RUNNER_TEMP/head.txt"
      - name: benchstat
        run: go tool -modfile=tools/go.mod benchstat "$RUNNER_TEMP/base.txt" "$RUNNER_TEMP/head.txt"
      - name: Benchmark gate (allocations, or a slowdown over 10%)
        run: go -C tools run ./benchgate -base "$RUNNER_TEMP/base.txt" -head "$RUNNER_TEMP/head.txt" -max-slowdown 0.10

  price-flags:
    # ADR 0007: a person looks at any changed price or limit, and at any max
    # output equal to the context window. The job summary lists them. It fails
    # only on a reviewed max output equal to the context window with no
    # explanation in the reviewed file; go test runs that check too.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
        with:
          cache: test
      - name: Flag price data for review
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$RUNNER_TEMP/base-table.json"
          git show "$BASE_SHA:internal/pricing/table.json" > "$base" 2>/dev/null ||
            cp internal/pricing/table.json "$base" # a base from before the table
          go run ./internal/pricing/pricegen check --base "$base" --github >> "$GITHUB_STEP_SUMMARY"

  systemd-creds:
    # SPEC §17: the systemd-creds key-source tests run on Linux in a
    # container booted with systemd. The vault test binary encrypts a master
    # key with systemd-creds and runs itself as a transient service with
    # LoadCredentialEncrypted= (internal/vault/systemd_linux_test.go).
    # systemd-run --wait --pipe talks to systemd over the system D-Bus, not
    # its private socket, so the container needs a bus daemon too. Under a
    # container manager systemd leaves / with Docker's private propagation,
    # and the credential mount it makes for a service in a helper namespace
    # never reaches the service, so the container makes / shared first, as
    # systemd itself does on a host.
    #
    # The container installs systemd while the job builds the tests: it
    # starts first, from the Azure mirror the runners themselves use, and the
    # test binary reaches it through the bind mount once built.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Start systemd in a container
        env:
          IMAGE: ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
        run: |
          mkdir -p "$RUNNER_TEMP/kman-systemd"
          docker run -d --name systemd --privileged --cgroupns=private \
            -e container=docker --tmpfs /run --tmpfs /run/lock \
            -v "$RUNNER_TEMP/kman-systemd:/kman:ro" \
            "$IMAGE" bash -c 'sed -i "s|http://\(archive\|security\).ubuntu.com|http://azure.archive.ubuntu.com|" /etc/apt/sources.list.d/ubuntu.sources &&
              apt-get update -q -o Acquire::Languages=none -o Acquire::Retries=3 -o Acquire::http::Timeout=30 &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dpkg::Options::=--force-unsafe-io systemd dbus &&
              mount --make-rshared / &&
              exec /usr/lib/systemd/systemd'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache: test
      - name: Build the vault tests
        env:
          CGO_ENABLED: "0"
        run: go test -c -o "$RUNNER_TEMP/kman-systemd/vault.test" ./internal/vault
      # The install and the boot are waited for apart: apt has taken longer
      # than the boot's three minutes, and the logs then say how far it got.
      - name: Wait for systemd to be installed
        run: |
          for _ in $(seq 1 420); do
            if [ "$(docker exec systemd cat /proc/1/comm 2>/dev/null)" = systemd ]; then
              echo "systemd is installed and started"; exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' systemd)" != true ]; then break; fi
            sleep 1
          done
          echo "systemd was not installed and started"
          docker logs systemd 2>&1 | tail -50
          exit 1
      - name: Wait for systemd to boot
        run: |
          for _ in $(seq 1 180); do
            state=$(docker exec systemd systemctl is-system-running 2>/dev/null || true)
            case "$state" in running|degraded)
              if docker exec systemd test -S /run/dbus/system_bus_socket; then
                echo "systemd is $state, with a system bus"; exit 0
              fi ;;
            esac
            sleep 1
          done
          echo "systemd did not boot (last state: ${state:-none})"
          docker logs systemd | tail -50
          exit 1
      - name: systemd-creds key-source tests
        run: docker exec -e KMAN_TEST_SYSTEMD=1 systemd /kman/vault.test -test.run 'Systemd' -test.v
      - name: Container logs
        if: failure()
        run: |
          docker logs systemd 2>&1 | tail -100
          docker exec systemd journalctl --no-pager -n 100 || true

  tui:
    # ADR 0009: the terminal client builds, type-checks and tests on its own, and its
    # API client is run against the real binary so its types cannot drift from the API.
    # A pull request that touches neither the client nor the Go that serves the
    # API (docs alone, say) has nothing to test here, and the steps skip.
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Does the change reach the client?
        id: changed
        run: |
          # On a pull request HEAD is the merge commit, and HEAD^1 the base.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] &&
            git diff --quiet HEAD^1 HEAD -- tui cmd internal go.mod go.sum .github/workflows/ci.yml .github/actions; then
            echo "The change does not reach the client or the admin API."
            echo "tui=false" >> "$GITHUB_OUTPUT"
          else
            echo "tui=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.tui == 'true'
        uses: ./.github/actions/setup-go
        with:
          cache: test
      - if: steps.changed.outputs.tui == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tui/package-lock.json
      - name: Install, type-check, build, test
        if: steps.changed.outputs.tui == 'true'
        working-directory: tui
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
      - name: The client against a real kman
        if: steps.changed.outputs.tui == 'true'
        working-directory: tui
        run: |
          go build -o "$RUNNER_TEMP/kman" ../cmd/kman
          cfg="$RUNNER_TEMP/cfg"; data="$RUNNER_TEMP/data"
          "$RUNNER_TEMP/kman" init --config-dir "$cfg" --data-dir "$data" \
            --admin-listen 127.0.0.1:18081 --proxy-listen 127.0.0.1:18080 --no-save-token > "$RUNNER_TEMP/init.out"
          token="$(grep -o 'kma_[A-Za-z0-9_-]*' "$RUNNER_TEMP/init.out" | head -1)"
          echo "::add-mask::$token"
          "$RUNNER_TEMP/kman" serve --config-dir "$cfg" > "$RUNNER_TEMP/serve.log" 2>&1 &
          for _ in $(seq 1 50); do curl -fs http://127.0.0.1:18081/admin/v1/openapi.json > /dev/null && break; sleep 0.2; done
          export KMAN_ADMIN_URL=http://127.0.0.1:18081 KMAN_ADMIN_TOKEN="$token"
          FAKE=sk-ci-not-a-real-credential "$RUNNER_TEMP/kman" upstream add openai --preset openai --credential-env FAKE --config-dir "$cfg"
          KMAN_TUI_LIVE_URL="$KMAN_ADMIN_URL" KMAN_TUI_LIVE_TOKEN="$token" npm test -- test/live.test.ts

  required:
    if: always()
    needs: [lint, test, sdk-e2e, canary-deadline, race, cross-compile, price-flags, systemd-creds, bench, tui]
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Every gate passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
